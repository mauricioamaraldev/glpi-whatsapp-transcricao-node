services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glpi-whatsapp-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/app/src:ro
      - whatsapp_auth:/app/.wwebjs_auth
      - bot_data:/app/data
      - bot_temp:/app/temp

volumes:
  whatsapp_auth:
  bot_data:
  bot_temp:
